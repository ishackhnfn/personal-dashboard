<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Greeting Section -->
  <section id="greeting-section">
    <h1 id="greeting">Hello!</h1>
    <p id="clock">00:00:00</p>
    <p id="date">Loading...</p>
  </section>

  <!-- Focus Timer Section -->
  <section id="timer-section">
    <h2>Focus Timer</h2>
    <div id="timer-display">25:00</div>
    <div id="timer-controls">
      <button id="timer-start">Start</button>
      <button id="timer-stop">Stop</button>
      <button id="timer-reset">Reset</button>
    </div>
    <div id="timer-settings">
      <label for="timer-minutes">Minutes:</label>
      <input type="number" id="timer-minutes" min="1" max="120" value="25">
      <button id="timer-set">Set</button>
    </div>
  </section>

  <!-- To-Do List Section -->
  <section id="todo-section">
    <h2>To-Do List</h2>
    <div id="todo-input-row">
      <input type="text" id="todo-input" placeholder="Add a task...">
      <button id="todo-add">Add</button>
    </div>
    <ul id="todo-list"></ul>
  </section>

  <!-- Quick Links Section -->
  <section id="links-section">
    <h2>Quick Links</h2>
    <div id="links-input-row">
      <input type="text" id="link-name" placeholder="Name (e.g. GitHub)">
      <input type="text" id="link-url" placeholder="URL (e.g. https://github.com)">
      <button id="link-add">Add</button>
    </div>
    <div id="links-container"></div>
  </section>

  <!-- Theme Toggle -->
  <button id="theme-toggle" title="Toggle dark mode">🌙 Dark</button>

  <!-- Custom Name -->
  <div id="name-section">
    <input type="text" id="name-input" placeholder="Your name">
    <button id="name-save">Save Name</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
